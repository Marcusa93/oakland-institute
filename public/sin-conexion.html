<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2a6b">
  <title>Sin conexión · Oakland Institute</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f8fa; color: #1a2230;
    }
    main { max-width: 26rem; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 20px 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 24px; line-height: 1.5; color: #4c586b; }
    button {
      min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
      background: #1c2a6b; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #8fb8ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/iconos/icono-192.png" alt="">
    <h1>No hay conexión</h1>
    <p>Para ver tus clases, avisos y pagos hace falta internet. Revisá el wifi o los datos y probá de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
